<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Notas - EPN</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Calculadora de Notas</h1>
    <p class="subtitulo">Escuela Politécnica Nacional</p>

    <form id="formulario" novalidate>
      <label for="aporte1">Nota del I Aporte (0 - 20):</label>
      <input type="number" id="aporte1" min="0" max="20" step="0.01" required />

      <label for="aporte2">Nota del II Aporte (0 - 20):</label>
      <input type="number" id="aporte2" min="0" max="20" step="0.01" required />

      <button type="submit">Calcular</button>
    </form>

    <div id="error" class="error" hidden></div>

    <div id="resultado" class="resultado" hidden>
      <p><strong>Suma:</strong> <span id="suma"></span> / 40</p>
      <p><strong>Estado:</strong> <span id="estado"></span></p>
      <p id="detalle"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
